x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - /opt/n8n/.env
    volumes:
      - /opt/n8n/data:/home/node/.n8n
      - /opt/n8n/rmapi-staging:/home/node/.n8n-files
    networks:
      - homelab
    depends_on:
      - gotenberg
      - rmapi
      - article-extractor
      - notebook-builder
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.n8n.rule=Host(`n8n.jenskock.de`)"
      - "traefik.http.routers.n8n.entrypoints=web"
      - "traefik.http.services.n8n.loadbalancer.server.port=5678"

  rmapi:
    build: ./rmapi
    image: rmapi:0.0.34
    container_name: n8n-rmapi
    restart: unless-stopped
    logging: *default-logging
    environment:
      RMAPI_CONFIG: /home/node/.config/rmapi/rmapi.conf
      TZ: Europe/Berlin
    volumes:
      - /opt/n8n/rmapi:/home/node/.config/rmapi
      - /opt/n8n/rmapi-staging:/data
    networks:
      - homelab

  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: n8n-gotenberg
    restart: unless-stopped
    logging: *default-logging
    command:
      - "gotenberg"
      - "--api-timeout=120s"
      - "--chromium-allow-list=^file:///tmp/.*|^https?://.*"
    networks:
      - homelab

  article-extractor:
    build: ./article-extractor
    image: article-extractor:1.0.0
    container_name: n8n-article-extractor
    restart: unless-stopped
    logging: *default-logging
    environment:
      GOTENBERG_URL: http://n8n-gotenberg:3000
      TZ: Europe/Berlin
      MAX_ARTICLES: "25"
    depends_on:
      - gotenberg
    networks:
      - homelab

  notebook-builder:
    build: ./notebook-builder
    image: notebook-builder:1.0.0
    container_name: n8n-notebook-builder
    restart: unless-stopped
    logging: *default-logging
    environment:
      TZ: Europe/Berlin
    networks:
      - homelab

networks:
  homelab:
    external: true
    name: homelab
