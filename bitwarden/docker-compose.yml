x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  bitwarden:
    image: vaultwarden/server:latest
    container_name: bitwarden
    restart: unless-stopped
    logging: *default-logging
    environment:
      SIGNUPS_ALLOWED: "false"
      SHOW_PASSWORD_HINT: "false"
      USER_ATTACHMENT_LIMIT: "100000000"
      DOMAIN: "https://lab-bw.jenskock.de"
    volumes:
      - /opt/bitwarden/data:/data
    networks:
      - homelab
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bitwarden.rule=Host(`lab-bw.jenskock.de`)"
      - "traefik.http.routers.bitwarden.entrypoints=web"
      - "traefik.http.services.bitwarden.loadbalancer.server.port=80"

networks:
  homelab:
    external: true
    name: homelab
