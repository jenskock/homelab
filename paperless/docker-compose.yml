x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  broker:
    image: docker.io/library/redis:8
    container_name: paperless-broker
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - /opt/paperless/redisdata:/data
    networks:
      - homelab

  db:
    image: docker.io/library/postgres:18
    container_name: paperless-db
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - /opt/paperless/.env
    volumes:
      - /opt/paperless/pgdata:/var/lib/postgresql
    networks:
      - homelab

  gotenberg:
    image: docker.io/gotenberg/gotenberg:8.24
    container_name: paperless-gotenberg
    restart: unless-stopped
    logging: *default-logging
    command:
      - "gotenberg"
      - "--chromium-disable-javascript=true"
      - "--chromium-allow-list=file:///tmp/.*"
    networks:
      - homelab

  tika:
    image: docker.io/apache/tika:latest
    container_name: paperless-tika
    restart: unless-stopped
    logging: *default-logging
    networks:
      - homelab

  webserver:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    container_name: paperless
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - db
      - broker
      - gotenberg
      - tika
    volumes:
      - /opt/paperless/data:/usr/src/paperless/data
      - /mnt/synology_backup/jens/Paperless/media:/usr/src/paperless/media
      - /mnt/synology_backup/jens/Paperless/export:/usr/src/paperless/export
      - /mnt/synology_backup/jens/Paperless/consume:/usr/src/paperless/consume
    env_file:
      - /opt/paperless/.env
    environment:
      PAPERLESS_REDIS: redis://broker:6379
      PAPERLESS_DBHOST: db
      PAPERLESS_TIKA_ENABLED: 1
      PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://gotenberg:3000
      PAPERLESS_TIKA_ENDPOINT: http://tika:9998
    networks:
      - homelab
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.paperless.rule=Host(`paperless.jenskock.de`)"
      - "traefik.http.routers.paperless.entrypoints=web"
      - "traefik.http.services.paperless.loadbalancer.server.port=8000"

  paperless-ai:
    image: clusterzx/paperless-ai:latest
    container_name: paperless-ai
    restart: unless-stopped
    logging: *default-logging
    # paperless-ai truncates .env values at '=' (breaks Requesty keys)
    entrypoint:
      - /bin/sh
      - -c
      - |
        JS=/app/services/setupService.js
        if [ -f "$$JS" ] && grep -qF "const [key, value] = line.split('=');" "$$JS"; then
          sed -i "s|const \[key, value\] = line.split('=');|const __eq = line.indexOf('='); const key = line.slice(0, __eq); const value = line.slice(__eq + 1);|" "$$JS"
        fi
        exec ./start-services.sh
    env_file:
      - /opt/paperless/.env
    volumes:
      - /opt/paperless/ai-data:/app/data
      - /opt/paperless/.env:/app/data/.env
    networks:
      - homelab
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.paperless-ai.rule=Host(`paperless-ai.jenskock.de`)"
      - "traefik.http.routers.paperless-ai.entrypoints=web"
      - "traefik.http.services.paperless-ai.loadbalancer.server.port=3000"

networks:
  homelab:
    external: true
    name: homelab
